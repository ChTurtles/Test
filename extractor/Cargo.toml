[package]
name = "rsf-extract"
version = "1.0.0"
edition = "2021"
description = "Reads Deep Rock Galactic gear stats from the player's own DRG pak for Rock and Stone Frontier"
license = "MIT"

[dependencies]
repak = { git = "https://github.com/trumank/repak", rev = "355b5f62f51959c7cc6dd5a51708646ef483065d", default-features = false, features = ["compression"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "unwind"
